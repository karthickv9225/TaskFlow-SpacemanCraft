<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Company Task Management System</title>
    <meta name="description" content="Company Task Management System with role-based Admin and Employee dashboards powered by Firebase Authentication and Cloud Firestore." />
    <meta property="og:title" content="TaskFlow — Company Task Management System" />
    <meta property="og:description" content="Company Task Management System with role-based Admin and Employee dashboards." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module">
      import { Auth } from '/js/auth.js';
      document.addEventListener('DOMContentLoaded', async function () {
        const redirected = await Auth.redirectIfAuthenticated();
        if (!redirected) {
          window.location.replace('login.html');
        }
      });
    </script>
  </head>
  <body data-page="index">
    <main class="router-screen">
      <div class="router-card">
        <div class="brand-lockup" style="justify-content: center; margin-bottom: 16px;">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
          <span>TaskFlow</span>
        </div>
        <h1>Company Task Management</h1>
        <p>Redirecting you to your workspace session...</p>
        <a href="login.html" class="btn btn-primary">Continue to Login</a>
      </div>
    </main>
  </body>
</html>
