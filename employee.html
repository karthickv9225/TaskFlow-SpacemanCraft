<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — TaskFlow Employee</title>
    <meta name="description" content="Employee dashboard for viewing assigned tasks, updating completion progress, and posting task comments." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="/js/employee.js"></script>
  </head>
  <body data-page="employee">
    <div class="app-shell">
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <aside id="sidebar" class="sidebar" aria-label="Employee Navigation">
        <div class="sidebar-header">
          <a href="#dashboard" class="sidebar-brand">
            <span class="brand-mark" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <span>TaskFlow</span>
          </a>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section-label">Overview</div>
          <button type="button" class="nav-item active" data-view="dashboard">
            <span class="nav-item-main">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Dashboard</span>
            </span>
          </button>

          <div class="nav-section-label">Manage</div>
          <button type="button" class="nav-item" data-view="my-tasks">
            <span class="nav-item-main">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              <span>My Tasks</span>
            </span>
            <span id="nav-tasks-count" class="nav-count">0</span>
          </button>
          <button type="button" class="nav-item" data-view="notifications">
            <span class="nav-item-main">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span>Notifications</span>
            </span>
            <span id="nav-notif-count" class="nav-count">0</span>
          </button>
          <button type="button" class="nav-item" data-view="profile">
            <span class="nav-item-main">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span>Profile</span>
            </span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button type="button" id="logout-btn" class="btn-signout">
            <span>Sign out</span>
          </button>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle navigation menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h2 id="topbar-title" class="topbar-title">Dashboard</h2>
          </div>

          <div class="topbar-right">
            <button type="button" id="topbar-bell-btn" class="topbar-bell-btn" aria-label="View notifications">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span id="topbar-bell-badge" class="topbar-bell-badge">0</span>
            </button>
            <div class="topbar-user-info">
              <div id="topbar-avatar" class="user-avatar-circle" aria-hidden="true">EM</div>
              <div class="user-text">
                <span class="user-text-name" data-user-name>Employee</span>
                <span class="user-text-role" data-user-meta>Employee</span>
              </div>
            </div>
          </div>
        </header>

        <main id="main-view" class="main-content" aria-live="polite"></main>
      </div>
    </div>
  </body>
</html>
